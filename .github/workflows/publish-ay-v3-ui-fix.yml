name: Publish AY Zygisk V3 Arabic WebUI Fix

on:
  workflow_dispatch:
  push:
    branches:
      - fix/ay-v3-webui-arabic-banner
    paths:
      - '.github/workflows/publish-ay-v3-ui-fix.yml'

permissions:
  contents: write

jobs:
  publish-webui-fix:
    if: github.repository == 'ahmedyasir2023/AY-Zygisk'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download checksum-pinned runtime
        run: |
          curl --fail --location --retry 3 --output upstream.zip \
            https://github.com/OnyxZygisk/OnyxZygisk/releases/download/v1.09/OnyxZygisk-v1.09-399-820b68b-release.zip
          echo '76fc0ed44186a628d3816a2830320e234ed62e1aa962be99bc1bf224f5505de7  upstream.zip' | sha256sum -c -

      - name: Download complete licensing notices
        run: |
          curl --fail --location --retry 3 --output upstream-LICENSE \
            https://raw.githubusercontent.com/OnyxZygisk/OnyxZygisk/820b68b31527c41d5decf4a47765167ebe795dc8/LICENSE
          curl --fail --location --retry 3 --output upstream-NOTICE.md \
            https://raw.githubusercontent.com/OnyxZygisk/OnyxZygisk/820b68b31527c41d5decf4a47765167ebe795dc8/NOTICE.md

      - name: Render professional banner
        run: |
          python3 -m pip install --user 'CairoSVG==2.7.1'
          python3 -c "import cairosvg; cairosvg.svg2png(url='branding/ay-zygisk-banner.svg', write_to='AY-Zygisk-V3-Banner.png', output_width=1400)"

      - name: Package and verify updated V3
        run: |
          python3 tools/pack-ay-v3.py \
            --upstream upstream.zip \
            --license upstream-LICENSE \
            --notice upstream-NOTICE.md \
            --banner-png AY-Zygisk-V3-Banner.png \
            --skin-css webroot/assets/ay-v3.css \
            --arabic-xml webroot/locales/strings/ar.xml \
            --output AY-Zygisk-V3.0.0-BlackGold-Arabic-UIFix.zip
          python3 tests/test-ay-v3.py upstream.zip AY-Zygisk-V3.0.0-BlackGold-Arabic-UIFix.zip
          unzip -tq AY-Zygisk-V3.0.0-BlackGold-Arabic-UIFix.zip
          sha256sum AY-Zygisk-V3.0.0-BlackGold-Arabic-UIFix.zip > AY-Zygisk-V3.0.0-Arabic-UIFix-SHA256.txt

      - name: Attach fixed build to existing V3.0.0 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v3.0.0 \
            AY-Zygisk-V3.0.0-BlackGold-Arabic-UIFix.zip \
            AY-Zygisk-V3.0.0-Arabic-UIFix-SHA256.txt \
            --repo "$GITHUB_REPOSITORY"
