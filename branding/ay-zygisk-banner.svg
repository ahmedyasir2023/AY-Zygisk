<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">AY Zygisk — Black &amp; Gold</title>
  <desc id="desc">A premium black and gold banner featuring the AY lightning symbol, Android 14+ and KernelSU Next development target.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A0E"/>
      <stop offset="0.58" stop-color="#111419"/>
      <stop offset="1" stop-color="#1B1712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFF0C1"/>
      <stop offset="0.29" stop-color="#F2CC75"/>
      <stop offset="0.58" stop-color="#D8A640"/>
      <stop offset="1" stop-color="#916017"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
