      <circle cx="98" cy="90" r="4" fill="#E6BC63"/>
      <text x="115" y="96" fill="#F3D184" font-size="14" font-weight="700" letter-spacing="2.5">ENG. AHMED YASIR</text>

      <text x="72" y="233" fill="#FCF7E9" font-size="91" font-weight="850" letter-spacing="3.4">AY</text>
      <text x="238" y="233" fill="url(#gold)" font-size="91" font-weight="850" letter-spacing="3.4">ZYGISK</text>
